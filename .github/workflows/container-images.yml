name: Container Images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-service
          - discovery-service
          - gateway-service
          - user-service
          - complaint-service
          - assignment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Detect application source
        id: source
        shell: bash
        run: |
          if [[ -f "${{ matrix.service }}/gradlew" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.service }} until its Spring Boot source is added."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.source.outputs.available == 'true'

      - uses: docker/login-action@v3
        if: steps.source.outputs.available == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.source.outputs.available == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.source.outputs.available == 'true'
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

