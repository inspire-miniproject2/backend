name: Deploy Development

on:
  workflow_run:
    workflows:
      - Container Images
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Seven-to-forty character commit SHA already published to GHCR
        required: true
        type: string

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::313984758699:role/GCivilGitHubActionsDeployRole
      DEV_EC2_INSTANCE_ID: i-0f1208c667275ae51

    steps:
      - name: Resolve immutable image tag
        id: image
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
              echo "Manual development deployments must run from the develop branch."
              exit 1
            fi
            image_tag="$MANUAL_IMAGE_TAG"
          else
            image_tag="${WORKFLOW_RUN_SHA:0:7}"
          fi

          if [[ ! "$image_tag" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Invalid image tag: expected a seven-to-forty character lowercase commit SHA."
            exit 1
          fi

          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable image tag: $image_tag"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "313984758699"
          role-session-name: GitHubActions-DeployDevelopment

      - name: Deploy through Systems Manager
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          remote_script="set -Eeuo pipefail; git -C /home/ubuntu/g-civil-msa pull --ff-only origin develop; exec /home/ubuntu/g-civil-msa/scripts/deploy-dev.sh $IMAGE_TAG"
          parameters="$(jq -n --arg command "$remote_script" '{
            commands: [
              ("sudo -u ubuntu -H bash -lc " + ($command | @sh))
            ]
          }')"

          command_id="$(aws ssm send-command \
            --instance-ids "$DEV_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend image tag $IMAGE_TAG" \
            --parameters "$parameters" \
            --timeout-seconds 1500 \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"
          result=""
          status="Pending"

          for attempt in $(seq 1 180); do
            result="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$DEV_EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)"

            if [[ -n "$result" ]]; then
              status="$(jq -r '.Status // "Pending"' <<< "$result")"
              echo "Attempt $attempt/180: $status"
              case "$status" in
                Success|Cancelled|Failed|TimedOut|Cancelling)
                  break
                  ;;
              esac
            fi

            sleep 5
          done

          if [[ -n "$result" ]]; then
            echo "--- EC2 standard output ---"
            jq -r '.StandardOutputContent // empty' <<< "$result"
            echo "--- EC2 standard error ---"
            jq -r '.StandardErrorContent // empty' <<< "$result"
          fi

          if [[ "$status" != "Success" ]]; then
            echo "Deployment did not succeed. Final SSM status: $status"
            exit 1
          fi
