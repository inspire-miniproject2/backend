name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit titles
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/validate-commit-message.sh --range "$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ./scripts/validate-commit-message.sh --subject "$(git log -1 --format='%s')"
          else
            ./scripts/validate-commit-message.sh --range "$BEFORE_SHA..$HEAD_SHA"
          fi

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example -f infra/docker-compose.yml -f infra/docker-compose.apps.yml config --quiet
      - name: Validate shell scripts
        run: bash -n scripts/*.sh .githooks/commit-msg

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test available services
        shell: bash
        run: |
          set -euo pipefail
          tested=0
          for service in discovery-service config-service gateway-service complaint-service department-service notification-service; do
            if [[ -f "$service/gradlew" ]]; then
              echo "Testing $service"
              (cd "$service" && chmod +x gradlew && ./gradlew test --no-daemon)
              tested=1
            fi
          done
          if [[ "$tested" -eq 0 ]]; then
            echo "No Spring Boot service source has been added yet."
          fi
