name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate commit titles
        run: |
          set -euo pipefail
          ./scripts/validate-commit-message.sh --subject "$(git log -1 --format='%s')"

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml -f infra/docker-compose.apps.yml config --quiet
          docker compose --env-file .env.dev.example -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config --quiet

      - name: Validate shell scripts
        run: bash -n scripts/*.sh .githooks/commit-msg

      - name: Detect Spring Boot source
        id: backend
        shell: bash
        run: |
          available=false
          for service in discovery-service config-service gateway-service user-service complaint-service assignment-service notification-service statistics-service; do
            if [[ -f "$service/gradlew" ]]; then
              available=true
              break
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" == "false" ]]; then
            echo "No Spring Boot service source has been added yet."
          fi

      - uses: actions/setup-java@v4
        if: steps.backend.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Test available services
        if: steps.backend.outputs.available == 'true'
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          set -euo pipefail
          tested=0
          for service in discovery-service config-service gateway-service user-service complaint-service assignment-service notification-service statistics-service; do
            if [[ -f "$service/gradlew" ]]; then
              echo "Testing $service"
              (cd "$service" && chmod +x gradlew && ./gradlew test --no-daemon --stacktrace)
            fi
          done
