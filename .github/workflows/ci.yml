name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit titles
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/validate-commit-message.sh --range "$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ./scripts/validate-commit-message.sh --subject "$(git log -1 --format='%s')"
          else
            ./scripts/validate-commit-message.sh --range "$BEFORE_SHA..$HEAD_SHA"
          fi

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example -f infra/docker-compose.yml -f infra/docker-compose.apps.yml config --quiet

      - name: Validate shell scripts
        run: bash -n scripts/*.sh .githooks/commit-msg

      - name: Detect Spring Boot source
        id: backend
        shell: bash
        run: |
          available=false
          for service in discovery-service config-service gateway-service user-service complaint-service assignment-service notification-service; do
            if [[ -f "$service/gradlew" ]]; then
              available=true
              break
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" == "false" ]]; then
            echo "No Spring Boot service source has been added yet."
          fi

      - uses: actions/setup-java@v4
        if: steps.backend.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Test available services
        if: steps.backend.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for service in discovery-service config-service gateway-service user-service complaint-service assignment-service notification-service; do
            if [[ -f "$service/gradlew" ]]; then
              echo "Testing $service"
              (cd "$service" && chmod +x gradlew && ./gradlew test --no-daemon)
            fi
          done
