services:
  config-service:
    build:
      context: ../config-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONFIG_PORT:-8888}:8888"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8888
      SPRING_APPLICATION_NAME: config-service
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_COMPLAINT_CREATED_TOPIC: ${KAFKA_COMPLAINT_CREATED_TOPIC:-complaint.created.v1}
      KAFKA_COMPLAINT_CREATED_DLT: ${KAFKA_COMPLAINT_CREATED_DLT:-complaint.created.v1.dlt}
      KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:-complaint.status.changed.v1}
      KAFKA_COMPLAINT_STATUS_CHANGED_DLT: ${KAFKA_COMPLAINT_STATUS_CHANGED_DLT:-complaint.status.changed.v1.dlt}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:-complaint.response.registered.v1}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT:-complaint.response.registered.v1.dlt}
    volumes:
      - ../config-repo:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [g-civil-network]

  discovery-service:
    build:
      context: ../discovery-service
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DISCOVERY_PORT:-8761}:8761"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8761
      SPRING_APPLICATION_NAME: discovery-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [g-civil-network]

  gateway-service:
    build:
      context: ../gateway-service
    restart: unless-stopped
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: gateway-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-minwonon-auth}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    networks: [g-civil-network]

  user-service:
    build:
      context: ../user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "127.0.0.1:${USER_PORT:-8084}:8084"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: user-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://user-db:3306/${USER_DB_NAME:-user_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    networks: [g-civil-network]

  complaint-service:
    build:
      context: ../complaint-service
    restart: unless-stopped
    depends_on:
      complaint-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "127.0.0.1:${COMPLAINT_PORT:-8081}:8081"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: complaint-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      ASSIGNMENT_SERVICE_URL: http://assignment-service:8082
      USER_SERVICE_URL: http://user-service:8084
      SPRING_DATASOURCE_URL: jdbc:mysql://complaint-db:3306/${COMPLAINT_DB_NAME:-complaint_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${COMPLAINT_DB_USER:-complaint}
      SPRING_DATASOURCE_PASSWORD: ${COMPLAINT_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_COMPLAINT_CREATED_TOPIC: ${KAFKA_COMPLAINT_CREATED_TOPIC:-complaint.created.v1}
      KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:-complaint.status.changed.v1}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:-complaint.response.registered.v1}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_ATTACHMENT_BUCKET: ${S3_ATTACHMENT_BUCKET:-}
      S3_ATTACHMENT_PREFIX: ${S3_ATTACHMENT_PREFIX:-complaints/}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    networks: [g-civil-network]

  assignment-service:
    build:
      context: ../assignment-service
    restart: unless-stopped
    depends_on:
      assignment-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "127.0.0.1:${ASSIGNMENT_PORT:-8082}:8082"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: assignment-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://assignment-db:3306/${ASSIGNMENT_DB_NAME:-assignment_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${ASSIGNMENT_DB_USER:-assignment}
      SPRING_DATASOURCE_PASSWORD: ${ASSIGNMENT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    networks: [g-civil-network]

  notification-service:
    build:
      context: ../notification-service
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8083}:8083"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: notification-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://notification-db:3306/${NOTIFICATION_DB_NAME:-notification_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER:-notification}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:-complaint.status.changed.v1}
      KAFKA_COMPLAINT_STATUS_CHANGED_DLT: ${KAFKA_COMPLAINT_STATUS_CHANGED_DLT:-complaint.status.changed.v1.dlt}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:-complaint.response.registered.v1}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT:-complaint.response.registered.v1.dlt}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    networks: [g-civil-network]

  statistics-service:
    build:
      context: ../statistics-service
    restart: unless-stopped
    depends_on:
      statistics-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STATISTICS_PORT:-8085}:8085"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: 8085
      SPRING_APPLICATION_NAME: statistics-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://statistics-db:3306/${STATISTICS_DB_NAME:-statistics_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${STATISTICS_DB_USER:-statistics}
      SPRING_DATASOURCE_PASSWORD: ${STATISTICS_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_COMPLAINT_CREATED_TOPIC: ${KAFKA_COMPLAINT_CREATED_TOPIC:-complaint.created.v1}
      KAFKA_COMPLAINT_CREATED_DLT: ${KAFKA_COMPLAINT_CREATED_DLT:-complaint.created.v1.dlt}
      KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:-complaint.status.changed.v1}
      KAFKA_COMPLAINT_STATUS_CHANGED_DLT: ${KAFKA_COMPLAINT_STATUS_CHANGED_DLT:-complaint.status.changed.v1.dlt}
    networks: [g-civil-network]
