name: ${COMPOSE_PROJECT_NAME:-g-civil-msa}

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: g-civil-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [g-civil-network]

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: g-civil-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_COMPLAINT_CREATED_TOPIC: ${KAFKA_COMPLAINT_CREATED_TOPIC:-complaint.created.v1}
      KAFKA_COMPLAINT_CREATED_DLT: ${KAFKA_COMPLAINT_CREATED_DLT:-complaint.created.v1.dlt}
      KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:-complaint.status.changed.v1}
      KAFKA_COMPLAINT_STATUS_CHANGED_DLT: ${KAFKA_COMPLAINT_STATUS_CHANGED_DLT:-complaint.status.changed.v1.dlt}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:-complaint.response.registered.v1}
      KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT:-complaint.response.registered.v1.dlt}
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_CREATED_TOPIC}" --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_CREATED_DLT}" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC}" --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_STATUS_CHANGED_DLT}" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC}" --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT}" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"
    networks: [g-civil-network]

  user-db:
    image: mysql:8.4
    container_name: g-civil-user-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${USER_DB_HOST_PORT:-3310}:3306"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${USER_DB_NAME:-user_db}
      MYSQL_USER: ${USER_DB_USER:-user}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${USER_DB_ROOT_PASSWORD:?set USER_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - user-mysql-data:/var/lib/mysql
    networks: [g-civil-network]

  complaint-db:
    image: mysql:8.4
    container_name: g-civil-complaint-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMPLAINT_DB_HOST_PORT:-3307}:3306"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${COMPLAINT_DB_NAME:-complaint_db}
      MYSQL_USER: ${COMPLAINT_DB_USER:-complaint}
      MYSQL_PASSWORD: ${COMPLAINT_DB_PASSWORD:?set COMPLAINT_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${COMPLAINT_DB_ROOT_PASSWORD:?set COMPLAINT_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - complaint-mysql-data:/var/lib/mysql
    networks: [g-civil-network]

  assignment-db:
    image: mysql:8.4
    container_name: g-civil-assignment-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASSIGNMENT_DB_HOST_PORT:-3308}:3306"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${ASSIGNMENT_DB_NAME:-assignment_db}
      MYSQL_USER: ${ASSIGNMENT_DB_USER:-assignment}
      MYSQL_PASSWORD: ${ASSIGNMENT_DB_PASSWORD:?set ASSIGNMENT_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ASSIGNMENT_DB_ROOT_PASSWORD:?set ASSIGNMENT_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - assignment-mysql-data:/var/lib/mysql
    networks: [g-civil-network]

  notification-db:
    image: mysql:8.4
    container_name: g-civil-notification-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-3309}:3306"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${NOTIFICATION_DB_NAME:-notification_db}
      MYSQL_USER: ${NOTIFICATION_DB_USER:-notification}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD:?set NOTIFICATION_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - notification-mysql-data:/var/lib/mysql
    networks: [g-civil-network]

  statistics-db:
    image: mysql:8.4
    container_name: g-civil-statistics-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STATISTICS_DB_HOST_PORT:-3311}:3306"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${STATISTICS_DB_NAME:-statistics_db}
      MYSQL_USER: ${STATISTICS_DB_USER:-statistics}
      MYSQL_PASSWORD: ${STATISTICS_DB_PASSWORD:?set STATISTICS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${STATISTICS_DB_ROOT_PASSWORD:?set STATISTICS_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - statistics-mysql-data:/var/lib/mysql
    networks: [g-civil-network]

networks:
  g-civil-network:
    name: g-civil-network

volumes:
  kafka-data:
  user-mysql-data:
  complaint-mysql-data:
  assignment-mysql-data:
  notification-mysql-data:
  statistics-mysql-data:
