spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:complaintdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

eureka:
  client:
    enabled: false

clients:
  assignment-service:
    url: http://localhost:8082
