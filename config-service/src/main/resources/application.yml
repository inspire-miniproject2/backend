server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:file:../config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
