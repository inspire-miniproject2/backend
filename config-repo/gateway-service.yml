spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: complaint-service
          uri: lb://complaint-service
          predicates:
            - Path=/api/complaints/**
        - id: assignment-service
          uri: lb://assignment-service
          predicates:
            - Path=/api/assignments/**,/api/departments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

jwt:
  secret: ${JWT_SECRET}

