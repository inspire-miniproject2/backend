spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  kafka:
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          assignment-service:
            connect-timeout: 2000
            read-timeout: 3000

gcivil:
  kafka:
    topics:
      complaint-created: ${KAFKA_COMPLAINT_CREATED_TOPIC:complaint.created.v1}
      complaint-status-changed: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:complaint.status.changed.v1}
      complaint-response-registered: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:complaint.response.registered.v1}
