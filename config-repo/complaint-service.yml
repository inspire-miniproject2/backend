spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  kafka:
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          assignment-service:
            connect-timeout: 2000
            read-timeout: 3000

gcivil:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_ATTACHMENT_BUCKET:}
      prefix: ${S3_ATTACHMENT_PREFIX:complaints/}
  kafka:
    topics:
      complaint-created: ${KAFKA_COMPLAINT_CREATED_TOPIC:complaint.created.v1}
      complaint-status-changed: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:complaint.status.changed.v1}
      complaint-response-registered: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:complaint.response.registered.v1}
