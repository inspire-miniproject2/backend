spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  kafka:
    producer:
      acks: all
      retries: 3
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          assignment-service:
            connect-timeout: 2000
            read-timeout: 3000

gcivil:
  kafka:
    topics:
      complaint-created: ${KAFKA_COMPLAINT_CREATED_TOPIC:complaint.created.v1}
      complaint-status-changed: ${KAFKA_COMPLAINT_STATUS_TOPIC:complaint.status.changed.v1}
      complaint-response-registered: ${KAFKA_COMPLAINT_RESPONSE_TOPIC:complaint.response.registered.v1}
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      path: ${LOCAL_STORAGE_PATH:/data/attachments}
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_ATTACHMENT_BUCKET:}
