spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

gcivil:
  kafka:
    topics:
      complaint-status-changed: ${KAFKA_COMPLAINT_STATUS_CHANGED_TOPIC:complaint.status.changed.v1}
      complaint-status-changed-dlt: ${KAFKA_COMPLAINT_STATUS_CHANGED_DLT:complaint.status.changed.v1.dlt}
      complaint-response-registered: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_TOPIC:complaint.response.registered.v1}
      complaint-response-registered-dlt: ${KAFKA_COMPLAINT_RESPONSE_REGISTERED_DLT:complaint.response.registered.v1.dlt}

