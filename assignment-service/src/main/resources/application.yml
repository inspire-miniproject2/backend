server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: assignment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

assignment:
  internal:
    allowed-caller: ${ASSIGNMENT_ALLOWED_CALLER:complaint-service}
    user-service-caller: ${ASSIGNMENT_USER_SERVICE_CALLER:assignment-service}
