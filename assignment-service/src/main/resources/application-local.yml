spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/${ASSIGNMENT_DB_NAME:assignment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:${ASSIGNMENT_DB_USER:assignment}}
    password: ${DB_PASSWORD:${ASSIGNMENT_DB_PASSWORD:assignment_local_pw}}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

logging:
  level:
    root: INFO
    com.gcivil: DEBUG
